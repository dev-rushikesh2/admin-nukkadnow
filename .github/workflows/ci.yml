name: Admin CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  validate:
    name: Lint, Test & Architectural Boundary Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Architectural Boundary Check
        run: node tools/check-boundaries.mjs

      - name: Linting & Code Standards
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Unit Tests & Code Coverage
        run: pnpm run test:coverage

      - name: Build Application (Production Configuration)
        run: pnpm run build:prod

      - name: Verify Security Headers in Nginx Template
        run: node tools/verify-security-headers.mjs
