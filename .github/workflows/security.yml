name: Admin Security & Vulnerability Scan

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday at 03:00 UTC
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Dependency Audit & SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Dependency Audit (pnpm audit)
        run: pnpm audit --prod --audit-level high

      - name: Secret Leak Detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
