<div class="subscriptions-page-container">
  <admin-page-header
    title="Merchant SaaS Subscriptions"
    subtitle="Merchant subscription lifecycles, billing schedules, and manual exception waivers"
    breadcrumb="Console / Merchant SaaS Subscriptions">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
