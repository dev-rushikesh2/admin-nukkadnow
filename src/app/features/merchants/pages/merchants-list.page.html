<div class="merchants-page-container">
  <admin-page-header
    title="Merchant Master Registry"
    [subtitle]="'Registered seller businesses operating across ' + activeCityName() + ' localities and retail categories'"
    breadcrumb="Console / Merchants">
    <div actions>
      <button type="button" class="admin-btn btn-secondary btn-sm" (click)="loadMerchants()">↻ Refresh</button>
      <button type="button" class="admin-btn btn-primary btn-sm" (click)="exportCsv()">Export CSV</button>
    </div>
  </admin-page-header>

  <!-- City Scope Filter Bar (for Root & Super Admin) -->
  @if (sessionService.isRoot() || sessionService.isSuperAdmin()) {
    <div class="city-selector-bar">
      <span class="bar-lbl">Territory Filter:</span>
      <div class="city-pills">
        <button type="button" class="cpill" [class.active]="selectedCity === 'ALL'" (click)="onCityChange('ALL')">All Cities (Global)</button>
        <button type="button" class="cpill" [class.active]="selectedCity === 'Nagpur'" (click)="onCityChange('Nagpur')">📍 Nagpur</button>
        <button type="button" class="cpill" [class.active]="selectedCity === 'Akola'" (click)="onCityChange('Akola')">📍 Akola</button>
        <button type="button" class="cpill" [class.active]="selectedCity === 'Amravati'" (click)="onCityChange('Amravati')">📍 Amravati</button>
        <button type="button" class="cpill" [class.active]="selectedCity === 'Pune'" (click)="onCityChange('Pune')">📍 Pune</button>
      </div>
    </div>
  } @else if (sessionService.geoAssignment()) {
    <div class="geo-locked-banner">
      <span>📍 Managing merchant stores strictly within <strong>{{ sessionService.geoAssignment()?.cityName }} Municipal Territory</strong></span>
    </div>
  }

  <!-- Status Quick-Filter Tabs -->
  <div class="status-tabs-row">
    <button type="button" class="status-tab" [class.active]="selectedStatus === ''" (click)="setStatusTab('')">All Stores ({{ totalCount() }})</button>
    <button type="button" class="status-tab" [class.active]="selectedStatus === 'ACTIVE'" (click)="setStatusTab('ACTIVE')">✓ Active Stores</button>
    <button type="button" class="status-tab" [class.active]="selectedStatus === 'PENDING_VERIFICATION'" (click)="setStatusTab('PENDING_VERIFICATION')">⏳ Pending Verification</button>
    <button type="button" class="status-tab" [class.active]="selectedStatus === 'SUSPENDED'" (click)="setStatusTab('SUSPENDED')">🚫 Suspended</button>
  </div>

  <!-- Filter & Search Toolbar -->
  <div class="filter-toolbar">
    <div class="search-input-box">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        class="admin-input"
        placeholder="Search merchant name, legal entity, or locality..."
        [(ngModel)]="searchQuery"
        (ngModelChange)="onFilterChange()">
    </div>

    <div class="filter-controls">
      <select class="admin-select" [(ngModel)]="selectedLocality" (change)="onFilterChange()">
        <option value="">All {{ activeCityName() }} Localities</option>
        @for (loc of availableLocalities(); track loc) {
          <option [value]="loc">{{ loc }}</option>
        }
      </select>

      <select class="admin-select" [(ngModel)]="selectedMode" (change)="onFilterChange()">
        <option value="">All Seller Modes</option>
        <option value="RETAIL">Retail / Kirana</option>
        <option value="FOOD_STALL">Food & Dairy Stall</option>
        <option value="HOME_MAKER">Home Maker (Protected)</option>
        <option value="ARTISAN">Artisan Maker</option>
        <option value="SEASONAL">Seasonal Pop-up</option>
      </select>

      <button type="button" class="admin-btn btn-secondary btn-sm" (click)="resetFilters()">Clear Filters</button>
    </div>
  </div>

  <!-- Data Table with Custom Status & Mode Columns -->
  <div class="table-card">
    <admin-data-table
      [columns]="tableColumns"
      [data]="merchants()"
      [totalCount]="totalCount()"
      [loading]="loading()"
      (rowClick)="onRowClick($event)">
    </admin-data-table>
  </div>
</div>
