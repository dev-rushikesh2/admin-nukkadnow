<div class="system-health-page-container">
  <admin-page-header
    title="System Health & Telemetry"
    subtitle="Microservice mesh status, Redis memory usage, RabbitMQ queue lag and database pools"
    breadcrumb="Console / System Health & Telemetry">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
