<div class="notifications-page-container">
  <admin-page-header
    title="Broadcasts & Notifications"
    subtitle="Platform-wide announcements, emergency notices, SMS/WhatsApp delivery logs"
    breadcrumb="Console / Broadcasts & Notifications">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
