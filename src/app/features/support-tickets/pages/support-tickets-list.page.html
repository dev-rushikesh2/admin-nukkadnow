<div class="support-tickets-page-container">
  <admin-page-header
    title="Support & Helpdesk Tickets"
    subtitle="Customer and merchant support cases, SLA breach monitoring and ticket assignment"
    breadcrumb="Console / Support & Helpdesk Tickets">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
