<div class="localities-page-container">
  <admin-page-header
    title="Localities & Delivery Zones"
    subtitle="Nagpur micro-markets, zones, pincode maps and service boundary polygons"
    breadcrumb="Console / Localities & Delivery Zones">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
