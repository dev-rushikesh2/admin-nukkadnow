<div class="analytics-page-container">
  <admin-page-header
    title="Analytics & Heatmaps"
    subtitle="Executive GMV reports, merchant cohort retention and Nagpur locality order density"
    breadcrumb="Console / Analytics & Heatmaps">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
