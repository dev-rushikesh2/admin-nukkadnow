<div class="orders-page-container">
  <admin-page-header
    title="Live Orders Stream"
    subtitle="Global real-time order stream, fulfillment monitoring and emergency override cancellations"
    breadcrumb="Console / Live Orders Stream">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
