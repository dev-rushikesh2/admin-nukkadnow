<div class="settings-page-container">
  <admin-page-header
    title="Platform Settings & Policies"
    subtitle="Platform maintenance mode, security timeouts, IP whitelisting and compliance defaults"
    breadcrumb="Console / Platform Settings & Policies">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
