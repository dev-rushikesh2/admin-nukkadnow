<div class="refunds-disputes-page-container">
  <admin-page-header
    title="Refunds & Disputes Ledger"
    subtitle="Customer refund requests, dual-approval authorization ledger and chargeback investigations"
    breadcrumb="Console / Refunds & Disputes Ledger">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
