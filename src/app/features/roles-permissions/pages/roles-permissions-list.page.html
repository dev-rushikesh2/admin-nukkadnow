<div class="roles-permissions-page-container">
  <admin-page-header
    title="Roles & RBAC Matrix"
    subtitle="Granular administrative permission policies, role definitions and privilege elevation rules"
    breadcrumb="Console / Roles & RBAC Matrix">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
