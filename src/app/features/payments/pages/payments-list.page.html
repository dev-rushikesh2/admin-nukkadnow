<div class="payments-page-container">
  <admin-page-header
    title="Payments & Settlement Ledgers"
    subtitle="Payment gateway intents, escrow settlements, and failed PSP webhook replay tooling"
    breadcrumb="Console / Payments & Settlement Ledgers">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
