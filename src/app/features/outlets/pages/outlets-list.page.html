<div class="outlets-page-container">
  <admin-page-header
    title="Outlets & Geofences"
    subtitle="Physical merchant outlets, operating hours, capacity rules and Nagpur locality geofences"
    breadcrumb="Console / Outlets & Geofences">
    <div actions>
      <button class="admin-btn btn-secondary btn-sm" (click)="refresh()">↻ Refresh</button>
      <button class="admin-btn btn-primary btn-sm" (click)="exportRecords()">Export CSV</button>
    </div>
  </admin-page-header>

  <admin-data-table
    [columns]="tableColumns"
    [data]="store.items()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    (rowClick)="onRowClick($event)">
  </admin-data-table>
</div>
