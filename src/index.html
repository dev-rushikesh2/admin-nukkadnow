<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NukkadNow Super-Admin Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('nukkadnow_admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.className = theme === 'dark' ? 'theme-dark admin-theme-dark' : 'theme-light admin-theme-light';
      } catch (e) {}
    })();
  </script>
</head>
<body class="admin-theme-light">
  <admin-root></admin-root>
</body>
</html>
